# Render Blueprint: https://render.com/docs/blueprint-spec
# Values marked `sync: false` are entered in the Render dashboard when the
# Blueprint is created (copy them from backend/.env.example).
services:
  - type: web
    name: stormpath
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        sync: false
      - key: OSRM_URLS
        sync: false
      - key: OPEN_METEO_URL
        sync: false
      - key: PHOTON_URL
        sync: false
      - key: BASEMAP_URL
        sync: false
      - key: BASEMAP_LABELS_URL
        sync: false
      - key: HTTP_USER_AGENT
        sync: false
